name: CI/CD Habit Tracker

on:
  push:
    branches: [ "develop", "main", "hw-docker" ]
  pull_request:
    branches: [ "develop", "main", "hw-docker" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry flake8
          # Позволяем Poetry создать стандартное изолированное виртуальное окружение
          poetry install --no-root --no-interaction --no-ansi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Django Tests natively
        run: |
          cp .env.template .env
          # Запускаем тесты внутри созданного виртуального окружения Poetry
          poetry run python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Deploy to Yandex Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            mkdir -p ~/habit_tracker
            cd ~/habit_tracker
            
            if [ ! -d ".git" ]; then
              git clone https://github.com{{ github.repository }}.git .
            else
              git pull origin ${{ github.ref_name }}
            fi
            
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # На вашем сервере Yandex Cloud кэша GitHub нет — всё соберется с нуля идеально!
            docker compose down
            docker compose up -d --build
            docker image prune -f
