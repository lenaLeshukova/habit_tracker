name: CI/CD Habit Tracker

on:
  push:
    branches: [ "develop", "main", "hw-docker" ]
  pull_request:
    branches: [ "develop", "main", "hw-docker" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Verify and Run Tests inside Docker
        run: |
          # 1. Генерируем временные дефолтные переменные для тестов прямо на лету
          echo "SECRET_KEY='test_secret_key'" > .env
          echo "DEBUG=True" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1,web" >> .env
          echo "DB_NAME=habit_db" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=test_pass" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=5432" >> .env
          echo "CELERY_BROKER_URL=redis://redis:6379/0" >> .env
          echo "CELERY_RESULT_BACKEND=redis://redis:6379/1" >> .env
          echo "TELEGRAM_BOT_TOKEN=8782612760:AAGL9mnhNa5FJep24ZXWRVMO9FadiS7H-7c" >> .env
          
          # 2. ЖЕСТКИЙ СБРОС КЭША: Явно пересобираем только наши кастомные сервисы с нуля
          docker compose build --no-cache web celery_worker celery_beat
          
          # 3. Поднимаем всю инфраструктуру
          docker compose up -d
          
          # Даем базам данных 15 секунд на полную готовность
          sleep 15
          
          # Выводим статус для отладки
          docker compose ps
          
          # 4. Запускаем тесты Django внутри контейнера web. Если упадут — покажем логи
          docker compose exec -T web python manage.py test || { docker compose logs web; exit 1; }
          
          # Тушим контейнеры после успешных тестов
          docker compose down

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Deploy to Yandex Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            # Переходим в папку проекта или создаем её
            mkdir -p ~/habit_tracker
            cd ~/habit_tracker
            
            # Если репозиторий еще не клонирован — клонируем, иначе — обновляем
            if [ ! -d ".git" ]; then
              git clone https://github.com{{ github.repository }}.git .
            else
              git pull origin ${{ github.ref_name }}
            fi
            
            # Записываем секретный .env файл на сервере
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # Пересобираем и перезапускаем контейнеры
            docker compose down
            docker compose up -d --build
            
            # Очистка старых неиспользуемых образов, чтобы не забивать диск ВМ
            docker image prune -f
