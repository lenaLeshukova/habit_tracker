name: CI/CD Habit Tracker

on:
  push:
    branches: [ "develop", "main", "hw-docker" ]
  pull_request:
    branches: [ "develop", "main", "hw-docker" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Tests
        run: |
          poetry run python manage.py test

      - name: Check Docker Build
        run: |
          docker build -t test-build-web .

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Deploy to Yandex Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            # Переходим в папку проекта или создаем её
            mkdir -p ~/habit_tracker
            cd ~/habit_tracker
            
            # Если репозиторий еще не клонирован — клонируем, иначе — обновляем
            if [ ! -d ".git" ]; then
              git clone https://github.com{{ github.repository }}.git .
            else
              git pull origin ${{ github.ref_name }}
            fi
            
            # Записываем секретный .env файл на сервере
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # Пересобираем и перезапускаем контейнеры
            docker compose down
            docker compose up -d --build
            
            # Очистка старых неиспользуемых образов, чтобы не забивать диск ВМ
            docker image prune -f
